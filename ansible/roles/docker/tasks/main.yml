---
- name: Install required packages
  tags:
    - setup
  apt:
    name:
      - curl
      - git
      - docker.io
    state: present
    update_cache: yes

- name: Enable Docker
  tags:
    - setup
  service:
    name: docker
    state: started
    enabled: yes
  
- name: Add azureuser to docker group
  tags:
    - setup
  user:
    name: azureuser
    groups: docker
    append: yes

- name: Reset SSH connection
  tags:
    - setup
  meta: reset_connection

# -----------------------------
# Install kubectl
# -----------------------------
- name: Install kubectl
  tags:
    - setup
  shell: |
    curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    rm kubectl
  args:
    creates: /usr/local/bin/kubectl

# -----------------------------
# Install k3s
# -----------------------------
- name: Check if k3s exists
  tags:
    - setup
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s
  tags:
    - setup
  shell: curl -sfL https://get.k3s.io | sh -
  when: not k3s_binary.stat.exists

- name: Wait for k3s
  tags:
    - setup
  command: kubectl get nodes
  register: node_status
  retries: 15
  delay: 5
  until: node_status.rc == 0
  changed_when: false

# -----------------------------
# Configure kubectl
# -----------------------------
- name: Create kube directory
  tags:
    - setup
  file:
    path: /home/azureuser/.kube
    state: directory
    owner: azureuser
    group: azureuser
    mode: '0755'

- name: Copy k3s kubeconfig
  tags:
    - setup
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/azureuser/.kube/config
    remote_src: yes
    owner: azureuser
    group: azureuser
    mode: '0600'

- name: Replace localhost in kubeconfig
  tags:
    - setup
  replace:
    path: /home/azureuser/.kube/config
    regexp: '127\.0\.0\.1'
    replace: '127.0.0.1'

- name: Configure KUBECONFIG
  tags:
    - setup
  lineinfile:
    path: /home/azureuser/.bashrc
    line: 'export KUBECONFIG=$HOME/.kube/config'
    create: yes

# -----------------------------
# Clone Repository
# -----------------------------
- name: Clone RetailIQ repository
  tags:
    - setup
  become: true
  become_user: azureuser
  become_flags: "-i"
  git:
    repo: "{{ repo_url }}"
    dest: "{{ project_dir }}"
    version: "{{ repo_branch }}"
    force: yes
    update: yes

# -----------------------------
# Build Backend Image
# -----------------------------
- name: Build Backend Image
  tags:
    - build
  become: true
  become_user: azureuser
  command: docker build --pull -t retailiq-backend ./backend
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Build Frontend Image
# -----------------------------
- name: Build Frontend Image
  tags:
    - build
  become: true
  become_user: azureuser
  command: >
    docker build
    --build-arg NEXT_PUBLIC_API_URL=/api
    -t retailiq-frontend
    -f frontend/Dockerfile
    frontend
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Load Images into K3s
# -----------------------------
- name: Export backend image
  tags:
    - build
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: docker save retailiq-backend -o /tmp/backend.tar

- name: Load Backend Image
  tags:
    - build
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: k3s ctr images import /tmp/backend.tar

- name: Export frontend image
  tags:
    - build
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: docker save retailiq-frontend -o /tmp/frontend.tar

- name: Load Frontend Image
  tags:
    - build
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: k3s ctr images import /tmp/frontend.tar

- name: Remove backend tar
  tags:
    - build
  become: true
  become_user: azureuser
  file:
    path: /tmp/backend.tar
    state: absent

- name: Remove frontend tar
  tags:
    - build
  become: true
  become_user: azureuser
  file:
    path: /tmp/frontend.tar
    state: absent

- name: Apply Kubernetes manifests
  tags:
    - deploy
  become: true
  become_user: azureuser
  command: kubectl apply -f k8s/
  args:
    chdir: "{{ project_dir }}"

- name: Restart backend
  tags:
    - deploy
  become: true
  become_user: azureuser
  command: kubectl rollout restart deployment/backend

- name: Restart frontend
  tags:
    - deploy
  become: true
  become_user: azureuser
  command: kubectl rollout restart deployment/frontend

- name: Wait for backend
  tags:
    - deploy
  become: true
  become_user: azureuser
  command: kubectl rollout status deployment/backend

- name: Wait for frontend
  tags:
    - deploy
  become: true
  become_user: azureuser
  command: kubectl rollout status deployment/frontend