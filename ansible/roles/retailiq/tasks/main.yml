---
- name: Verify backend directory
  stat:
    path: /workspace/backend
  register: backend_dir

- name: Verify frontend directory
  stat:
    path: /workspace/frontend
  register: frontend_dir

- name: Verify terraform directory
  stat:
    path: /workspace/terraform
  register: terraform_dir

- name: Verify monitoring directory
  stat:
    path: /workspace/monitoring
  register: monitoring_dir

- name: Show deployment summary
  debug:
    msg:
      - "=========================================="
      - "RetailIQ Deployment Validation Complete"
      - ""
      - "Backend Folder    : {{ backend_dir.stat.exists }}"
      - "Frontend Folder   : {{ frontend_dir.stat.exists }}"
      - "Terraform Folder  : {{ terraform_dir.stat.exists }}"
      - "Monitoring Folder : {{ monitoring_dir.stat.exists }}"
      - ""
      - "Application validation successful."
      - "=========================================="