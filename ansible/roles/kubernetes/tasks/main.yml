---
- name: Set kubectl context
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl config use-context minikube
  changed_when: false
  
# -----------------------------
# ConfigMaps
# -----------------------------
- name: Apply ConfigMap
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl apply -f k8s/configmap.yml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Secrets
# -----------------------------
- name: Apply Secret
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl apply -f k8s/secret.yml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Nginx Config
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl apply -f k8s/nginx-configmap.yml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Nginx
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl apply -f k8s/nginx-deployment.yml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Nginx Service
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl apply -f k8s/nginx-service.yml
  args:
    chdir: "{{ project_dir }}"
    
