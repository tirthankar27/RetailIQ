# -----------------------------
# Show Cluster Status
# -----------------------------
- name: Show Pods
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl get pods -o wide
  register: pods
  changed_when: false

- debug:
    var: pods.stdout_lines

- name: Show Services
  become: true
  become_user: azureuser
  become_flags: "-i"
  command: kubectl get svc
  register: services
  changed_when: false

- debug:
    var: services.stdout_lines