---
# -----------------------------
# ConfigMaps
# -----------------------------
- name: Apply ConfigMap
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/configmap.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Secrets
# -----------------------------
- name: Apply Secret
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/secret.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Nginx Config
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/nginx-configmap.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Nginx
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/nginx-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Nginx Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/nginx-service.yaml
  args:
    chdir: "{{ project_dir }}"
    
# -----------------------------
# Persistent Volumes
# -----------------------------
- name: Apply PostgreSQL PVC
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/postgres-pvc.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Database
# -----------------------------
- name: Deploy PostgreSQL
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/postgres-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy PostgreSQL Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/postgres-service.yaml
  args:
    chdir: "{{ project_dir }}"

