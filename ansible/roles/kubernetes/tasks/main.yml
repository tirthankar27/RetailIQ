  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/redis-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Redis Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/redis-service.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Backend
# -----------------------------
- name: Deploy Backend
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/backend-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Backend Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/backend-service.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Frontend
# -----------------------------
- name: Deploy Frontend
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/frontend-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Frontend Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/frontend-service.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Prometheus
# -----------------------------
- name: Deploy Prometheus Config
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/prometheus-configmap.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Prometheus
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/prometheus-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Prometheus Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/prometheus-service.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Grafana
# -----------------------------
- name: Deploy Grafana
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/grafana-deployment.yaml
  args:
    chdir: "{{ project_dir }}"

- name: Deploy Grafana Service
  tags:
  - deploy
  become: true
  command: kubectl apply -f k8s/grafana-service.yaml
  args:
    chdir: "{{ project_dir }}"

# -----------------------------
# Wait for Rollout
# -----------------------------
- name: Wait for Backend
  tags:
  - deploy
  become: true
  command: kubectl rollout status deployment/backend --timeout=600s
  register: backend_rollout
  changed_when: false

- debug:
    var: backend_rollout.stdout_lines

- name: Wait for Frontend
  tags:
  - deploy
  become: true
  command: kubectl rollout status deployment/frontend --timeout=600s
  register: frontend_rollout
  changed_when: false

- debug:
    var: frontend_rollout.stdout_lines

- name: Wait for PostgreSQL
  tags:
  - deploy
  become: true
  command: kubectl rollout status deployment/postgres --timeout=600s
  register: postgres_rollout
  changed_when: false

- debug:
    var: postgres_rollout.stdout_lines

- name: Wait for Redis
  tags:
  - deploy
  become: true
  command: kubectl rollout status deployment/redis --timeout=600s
  register: redis_rollout
  changed_when: false

- debug:
    var: redis_rollout.stdout_lines

- name: Wait for Prometheus
  tags:
  - deploy
  become: true
  command: kubectl rollout status deployment/prometheus --timeout=600s
  register: prometheus_rollout
  changed_when: false

- debug:
    var: prometheus_rollout.stdout_lines

- name: Wait for Grafana
  tags:
  - deploy
  become: true
  command: kubectl rollout status deployment/grafana --timeout=600s
  register: grafana_rollout
  changed_when: false

- debug:
    var: grafana_rollout.stdout_lines

# -----------------------------
# Show Cluster Status
# -----------------------------
- name: Show Pods
  tags:
  - deploy
  become: true
  command: kubectl get pods -o wide
  register: pods
  changed_when: false

- debug:
    var: pods.stdout_lines

- name: Show Services
  tags:
  - deploy
  become: true
  command: kubectl get svc
  register: services
  changed_when: false

- debug:
    var: services.stdout_lines