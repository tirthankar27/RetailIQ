services:
  jenkins:
    build:
      context: ./jenkins

    container_name: retailiq-jenkins

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    
    restart: unless-stopped

volumes:
  
  jenkins_data:
    external: true
    name: retailiq-jenkins-data